name: CI

# Guardrail: runs the integration/regression tests on every push and PR.
# The tests start the built HTTP server and assert the MCP endpoint is served
# at the root path (Claude), /mcp (ChatGPT), and /sse (legacy) — so a change
# that breaks how a client connects fails here instead of in production.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm test
